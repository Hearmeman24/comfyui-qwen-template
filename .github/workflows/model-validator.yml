name: model-validator

on:
  pull_request:
    paths:
      - 'workflows/**'
      - 'src/models_registry.json'
      - 'src/workflows_registry.json'
      - '.github/workflows/model-validator.yml'
  push:
    branches: [master]
    paths:
      - 'workflows/**'
      - 'src/models_registry.json'
      - 'src/workflows_registry.json'
  schedule:
    # Weekly re-run against upstream rot: registry URLs can 404 without any
    # push here, and path-filtered push validation leaves CI green over a
    # broken template. Mondays 06:00 UTC. Path filters do not apply to
    # schedule events; the full validator runs every time.
    - cron: '0 6 * * 1'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run validator
        run: python3 .github/workflows/model_validator.py
